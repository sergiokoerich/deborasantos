<!DOCTYPE html>
<html lang="pt-BR">

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2b2320" />
    <!-- Título, descrição, Open Graph e JSON-LD são injetados pelo vite.config.js (src/data/seo.js). -->

    <!-- Google Tag Manager: o gtm.js só baixa depois do `load`, com o navegador ocioso,
         para não disputar CPU com a primeira renderização. Visitas que saem antes disso não contam. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      window.addEventListener('load', function () {
        function carregarGtm() {
          window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-53ZKVC9Q';
          document.head.appendChild(script);
        }
        if ('requestIdleCallback' in window) requestIdleCallback(carregarGtm, { timeout: 3000 });
        else setTimeout(carregarGtm, 0);
      });
    </script>
    <!-- End Google Tag Manager -->
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-53ZKVC9Q"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
